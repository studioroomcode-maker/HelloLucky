# iOS 빌드 · TestFlight 업로드 — Expo 앱 공용 템플릿 (HelloDashboard/templates). EAS 클라우드 빌드 없이 GitHub macOS 러너에서.
# 쓰는 법: 앱 저장소의 .github/workflows/ios-build.yml 로 복사 → 시크릿 7개 등록(ios-build-capacitor.yml 과 같은 이름·값,
#   apple-key.ps1 의 GitHub 분기 참고) → gh workflow run ios-build.yml -f build_number=<N>
# 처음 쓴 곳: HelloLucky (2026-10-17, EAS 무료 iOS 빌드 횟수를 다 써서).
#
# 흐름: expo prebuild 로 ios/ 를 만들고 → 앱 타깃에만 수동 서명(공용 배포 인증서 + 앱 App Store 프로파일) →
#   xcodebuild archive → exportArchive(destination=upload)로 App Store Connect 업로드.
# 빌드 번호는 EAS 원격 번호와 따로 간다 — 이미 올린 번호보다 큰 값을 build_number 로 준다.
#
# 시크릿: APPLE_TEAM_ID · APPLE_ASC_KEY_ID · APPLE_ASC_ISSUER_ID · APPLE_ASC_P8 · APPLE_DIST_P12 · APPLE_DIST_P12_PASSWORD · APPLE_PROFILE

name: ios-build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion (이미 올린 빌드보다 커야 함)'
        required: true
      upload:
        description: 'App Store Connect(TestFlight)로 바로 업로드'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-26   # App Store 업로드는 Xcode 26(iOS 26 SDK) 이상만 받는다 (2026)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 시크릿 확인
        run: |
          missing=()
          for k in APPLE_TEAM_ID APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_ASC_P8 APPLE_DIST_P12 APPLE_DIST_P12_PASSWORD APPLE_PROFILE; do
            [ -z "${!k}" ] && missing+=("$k")
          done
          if [ "${#missing[@]}" -gt 0 ]; then echo "다음 시크릿이 비어 있음: ${missing[*]}"; exit 1; fi
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_P8: ${{ secrets.APPLE_ASC_P8 }}
          APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}

      - name: Xcode 버전
        run: xcodebuild -version

      - name: 의존성 설치
        run: npm ci

      - name: 네이티브 iOS 프로젝트 만들기 (expo prebuild)
        run: |
          npx expo prebuild -p ios --clean --no-install
          cd ios && pod install
          WS=$(ls -d *.xcworkspace | head -1); APP="${WS%.xcworkspace}"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "워크스페이스: $WS"

      - name: 서명 인증서 · 프로파일 설치
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$APPLE_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$APPLE_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

          P="$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$APPLE_PROFILE" | base64 --decode > "$P"
          security cms -D -i "$P" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          APPID=$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$P" "$d/$UUID.mobileprovision"
          done
          echo "프로파일: $NAME ($UUID) · ${APPID#*.}"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=${APPID#*.}" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
        env:
          APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}

      - name: 앱 타깃만 수동 서명 · 빌드 번호 · 푸시 환경 (CI 안에서만)
        # 명령줄 빌드 설정은 Pods 타깃까지 퍼져 "does not support provisioning profiles" 로 깨진다 —
        # 앱 타깃에만 있는 PRODUCT_BUNDLE_IDENTIFIER 줄 뒤에 서명 설정을 붙인다.
        run: |
          PBX="ios/$APP.xcodeproj/project.pbxproj"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = \"*$BUNDLE_ID\"*;/& CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; DEVELOPMENT_TEAM = $APPLE_TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" "$PBX"
          n=$(grep -c "CODE_SIGN_STYLE = Manual" "$PBX"); echo "수동 서명 설정 $n곳"; [ "$n" -ge 1 ]
          plutil -replace CFBundleVersion -string "${{ inputs.build_number }}" "ios/$APP/Info.plist"
          ENT="ios/$APP/$APP.entitlements"
          # App Store 프로파일은 aps-environment=production — prebuild 기본값(development)이면 서명이 깨진다
          if [ -f "$ENT" ] && plutil -extract aps-environment raw "$ENT" >/dev/null 2>&1; then
            plutil -replace aps-environment -string production "$ENT"
          fi
          [ -f "$ENT" ] && plutil -p "$ENT" || true
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: App Store Connect API 키 파일 준비
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_ASC_P8" > "$RUNNER_TEMP/private_keys/AuthKey.p8"
        env:
          APPLE_ASC_P8: ${{ secrets.APPLE_ASC_P8 }}

      - name: 아카이브
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "ios/$APP.xcworkspace" \
            -scheme "$APP" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" | tail -200

      - name: 내보내기 옵션 작성
        run: |
          dest="export"
          if [ "${{ inputs.upload }}" = "true" ]; then dest="upload"; fi
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>${dest}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: 내보내기 · (선택) TestFlight 업로드
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey.p8" \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID"
        env:
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}

      - name: 키 파일 · 키체인 정리
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "$SIGN_KEYCHAIN" ] && security delete-keychain "$SIGN_KEYCHAIN" || true

      - name: IPA를 아티팩트로 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-ios-${{ inputs.build_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14
